<!DOCTYPE html>
<html>
<head>
    <title>My Browser</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: Arial; }
        .navbar {
            background: #333;
            padding: 10px;
            display: flex;
        }
        .url-bar {
            flex: 1;
            padding: 8px;
            margin: 0 10px;
            border-radius: 4px;
            border: none;
        }
        button {
            background: #555;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        webview {
            width: 100%;
            height: calc(100vh - 50px);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <button onclick="goBack()">←</button>
        <button onclick="goForward()">→</button>
        <button onclick="refresh()">↻</button>
        <input type="text" class="url-bar" id="url" 
               value="https://google.com" onkeypress="if(event.key=='Enter') go()">
        <button onclick="go()">Go</button>
    </div>
    
    <webview id="webview" src="https://google.com"></webview>
    
    <script>
        const webview = document.getElementById('webview');
        const urlInput = document.getElementById('url');
        
        function go() {
            let url = urlInput.value;
            if (!url.startsWith('http')) url = 'https://' + url;
            webview.src = url;
        }
        
        function goBack() { webview.goBack(); }
        function goForward() { webview.goForward(); }
        function refresh() { webview.reload(); }
        
        webview.addEventListener('did-navigate', (e) => {
            urlInput.value = e.url;
        });
    </script>
</body>
</html>
